<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮箱验证成功 · AI英文阅读助手</title>
  <meta name="description" content="邮箱验证成功，欢迎加入英语精读学习平台。" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 48%, #1e3a8a 100%);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 26rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.45);
      overflow: hidden;
      text-align: center;
    }
    .card-head {
      padding: 1.75rem 1.5rem 1.25rem;
      background: linear-gradient(90deg, #eff6ff 0%, #fff 100%);
      border-bottom: 1px solid #f1f5f9;
    }
    .logo {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 0.85rem;
      border-radius: 0.75rem;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emoji {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 0.65rem;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .card-body {
      padding: 1.5rem 1.5rem 1.75rem;
    }
    .welcome {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.5;
    }
    .hint {
      margin: 0 0 1.35rem;
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.55;
    }
    .cta {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: #2563eb;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .cta:hover { background: #1d4ed8; }
    .cta:active { background: #1e40af; }
    .foot {
      margin: 1rem 0 0;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    @media (max-width: 420px) {
      body { padding: 1rem; }
      h1 { font-size: 1.2rem; }
      .card-head, .card-body { padding-left: 1.15rem; padding-right: 1.15rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <div class="logo" aria-hidden="true">EN</div>
      <p class="emoji" aria-hidden="true">🎉</p>
      <h1>邮箱验证成功！</h1>
    </div>
    <div class="card-body">
      <p class="welcome">欢迎加入英语精读学习平台</p>
      <p class="hint">你的账号已经激活</p>
      <a class="cta" href="./index.html">开始第一次精读</a>
      <p class="foot">AI英文阅读助手</p>
    </div>
  </main>
</body>
</html>
